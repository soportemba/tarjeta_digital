<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>QR de contacto</title>
  <script src="https://jsdelivr.net"></script>
</head>
<body>
  <h3>Escanea el contacto:</h3>
  <div id="qrcode"></div>

  <script>
    window.onload = function () {
      if (typeof QRCode === "undefined") {
        document.getElementById("qrcode").innerText = "Error: No se pudo cargar la librería QR (revisa tu conexión a internet).";
        return;
      }

      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:García;Laura;;;",
        "FN:Laura García",
        "TEL;TYPE=CELL:+34600123456",
        "EMAIL;TYPE=WORK:laura@ejemplo.com",
        "END:VCARD"
      ].join("\n");

      new QRCode(document.getElementById("qrcode"), {
        text: vcard,
        width: 220,
        height: 220
      });
    };
  </script>
</body>
</html>
